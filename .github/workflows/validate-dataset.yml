name: Validate Python Mastery Dataset

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check pyodide-worker.js
      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/exercises.json','utf8')); console.log('JSON OK')"
      - name: Validate UI and runtime contracts
        run: node scripts/validate-ui.mjs
      - name: Validate exercises
        run: node scripts/validate-dataset.mjs
      - name: Audit solution tests
        run: python scripts/audit-solutions.py
