<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Python Mastery — 1155 تمرین Python</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Python Mastery</h1>
      <p>۱۱۵۵ تمرین واقعی Python</p>
    </div>
    <div class="progress-wrap">
      <span id="progressText">۰ / ۱۱۵۵</span>
      <div class="progress"><i id="progressBar"></i></div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <input id="search" type="search" placeholder="جستجوی تمرین...">
      <button class="btn secondary" onclick="exportExercises()" style="width:100%;margin-bottom:10px">دریافت دیتاست ۱۱۵۵ تمرین</button>
      <select id="category"></select>
      <label for="pyodideMirror">Mirror Pyodide (اختیاری)</label>
      <input id="pyodideMirror" type="url" placeholder="https://.../pyodide/v0.27.7/full/">
      <button class="btn secondary" onclick="savePyodideMirror()" style="width:100%;margin-bottom:10px">ذخیره Mirror و بارگذاری مجدد</button>
      <select id="difficulty">
        <option value="">همه سطح‌ها</option>
        <option value="آسان">آسان</option>
        <option value="متوسط">متوسط</option>
        <option value="سخت">سخت</option>
      </select>
      <div id="exerciseList"></div>
    </aside>

    <section class="content">
      <div id="exercise"></div>
    </section>
  </main>

  <script>document.getElementById("pyodideMirror").value=localStorage.getItem("python-mastery-pyodide-mirror")||"";</script>
  <script src="app.js"></script>
</body>
</html>
